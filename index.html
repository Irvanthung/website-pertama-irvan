<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Pertama Irvan</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
     background: linear-gradient(135deg, #0f0f0f, #4a148c);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      padding: 50px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 42px;
    }

    p {
      color: #d5e8ff;
      font-size: 20px;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      background: #ffb300;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
   <h1>Irvan Kurniawan</h1>
    <p>Problem Management & Business Continuity Management</p>
    <button onclick="alert('Website berhasil dibuat!')">
      Klik Saya
    </button>
  </div>
</body>
</html>
